services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    image: php:8.2-fpm
    volumes:
      - ./www:/var/www/html
      - ./:/app
    working_dir: /app
    expose:
      - "9000"

  phpunit:
    image: composer:2
    volumes:
      - ./:/app
    working_dir: /app
    entrypoint: ["php"]
    depends_on:
      - nginx